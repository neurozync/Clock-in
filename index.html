<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Patrol Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
--bg:#070c12;
--panel:#0f1720;
--line:#1f2a36;
--text:#e6edf3;
--muted:#7e8b9a;
--accent:#1f6feb;
--success:#16a34a;
--warn:#d48a12;
--danger:#dc2626;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui;
overflow:hidden;
}

.app{
height:100vh;
display:grid;
grid-template-rows:auto 1fr auto auto;
gap:6px;
padding:8px;
}

/* TOP */
.topbar{
display:grid;
grid-template-columns:1fr;
}

.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:14px;
padding:10px;
}

h3{
margin:0 0 6px;
font-size:.65rem;
letter-spacing:.08em;
color:var(--muted);
}

.address{
font-weight:800;
font-size:.9rem;
}

/* MAP */
.map{
border-radius:14px;
overflow:hidden;
border:1px solid var(--line);
}
#map{height:100%;}

/* STATUS */
.status{
display:flex;
gap:10px;
align-items:center;
}

.dot{
width:10px;height:10px;border-radius:50%;
background:#777;
}
.active{background:var(--success);}
.paused{background:var(--warn);}
.stopped{background:var(--danger);}

/* BADGES */
.badges{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
}
.badge{
text-align:center;
padding:8px;
border-radius:999px;
border:1px solid var(--line);
font-weight:800;
font-size:.75rem;
}

/* BUTTONS */
.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px;
}
button{
padding:12px;
border-radius:12px;
border:none;
font-weight:800;
color:#fff;
}
.primary{background:#1f6feb;}
.success{background:#16a34a;}
.warn{background:#d48a12;}
.danger{background:#dc2626;}
.neutral{background:#2a3440;}

button:disabled{opacity:.4}
</style>
</head>

<body>

<div class="app">

<!-- ADDRESS -->
<div class="topbar">
<div class="card">
<h3>CURRENT ADDRESS</h3>
<div id="address" class="address">Waiting for GPS...</div>
</div>
</div>

<!-- MAP -->
<div class="map"><div id="map"></div></div>

<!-- STATUS -->
<div class="card status">
<div id="dot" class="dot"></div>
<div id="status">Ready</div>
</div>

<!-- BADGES -->
<div class="badges">
<div id="markers" class="badge">Markers: 0</div>
<div id="crumbs" class="badge">Breadcrumbs: 0</div>
</div>

<!-- CONTROLS -->
<div class="controls">
<button id="locate" class="primary">Locate</button>
<button id="start" class="success" disabled>Start</button>
<button id="pause" class="warn" disabled>Pause</button>
<button id="resume" class="neutral" disabled>Resume</button>
<button id="mark" class="neutral">Mark</button>
<button id="end" class="danger" disabled>End</button>
</div>

</div>

<script>

const map=L.map("map").setView([33.4484,-112.074],13);

L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
).addTo(map);

let marker=null;
let watch=null;

let tracking=false;
let paused=false;

let lastPoint=null;
let crumbs=0;
let markers=0;

const addr=document.getElementById("address");
const status=document.getElementById("status");
const dot=document.getElementById("dot");
const crumbUI=document.getElementById("crumbs");
const markerUI=document.getElementById("markers");

function setStatus(s){
dot.className="dot";
if(s==="active"){dot.classList.add("active");status.textContent="Tracking";}
else if(s==="paused"){dot.classList.add("paused");status.textContent="Paused";}
else if(s==="stopped"){dot.classList.add("stopped");status.textContent="Ended";}
else{status.textContent="Ready";}
}

function update(lat,lng){

if(!marker){
marker=L.circleMarker([lat,lng],{radius:6,color:"#fff",fillColor:"#1f6feb",fillOpacity:1}).addTo(map);
}else{
marker.setLatLng([lat,lng]);
}

map.setView([lat,lng],18);

fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
.then(r=>r.json())
.then(d=>addr.textContent=d.display_name);

if(tracking && !paused){
if(!lastPoint){
lastPoint=[lat,lng];
}else{
const dist=map.distance(lastPoint,[lat,lng]);

if(dist>1){
L.circleMarker([lat,lng],{radius:2,color:"#1f6feb"}).addTo(map);
crumbs++;
crumbUI.textContent=`Breadcrumbs: ${crumbs}`;
lastPoint=[lat,lng];
}
}
}
}

function gpsSuccess(pos){
update(pos.coords.latitude,pos.coords.longitude);
}

function gpsError(e){
alert(e.message);
}

/* FAST TRACKING SETTINGS */
const gpsOpts={
enableHighAccuracy:true,
maximumAge:0,
timeout:10000
};

document.getElementById("locate").onclick=()=>{
navigator.geolocation.getCurrentPosition(gpsSuccess,gpsError,gpsOpts);

if(!watch){
watch=navigator.geolocation.watchPosition(gpsSuccess,gpsError,gpsOpts);
}
};

document.getElementById("start").onclick=()=>{
tracking=true;
paused=false;
setStatus("active");
};

document.getElementById("pause").onclick=()=>{
paused=true;
setStatus("paused");
};

document.getElementById("resume").onclick=()=>{
paused=false;
setStatus("active");
};

document.getElementById("mark").onclick=()=>{
if(marker){
L.marker(marker.getLatLng()).addTo(map);
markers++;
markerUI.textContent=`Markers: ${markers}`;
}
};

document.getElementById("end").onclick=()=>{
tracking=false;
paused=false;
setStatus("stopped");
};

/* ENABLE START AFTER LOCK */
navigator.geolocation.getCurrentPosition(()=>{
document.getElementById("start").disabled=false;
});

</script>

</body>
</html>

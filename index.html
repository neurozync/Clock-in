<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tactical Patrol Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
  background:#05080d;
  color:#fff;
}

#map{
  width:100%;
  height:100vh;
}

.top-bar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:9999;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,255,170,.2);
  padding:10px;
}

.address-box{
  margin-bottom:10px;
}

.label{
  font-size:10px;
  color:#00ff9d;
  letter-spacing:1px;
  margin-bottom:4px;
}

#address{
  font-size:13px;
  font-weight:bold;
  line-height:1.4;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat-card{
  background:rgba(15,20,30,.95);
  border:1px solid rgba(0,255,170,.2);
  border-radius:14px;
  text-align:center;
  padding:10px;
}

.stat-label{
  font-size:10px;
  color:#9ca3af;
  margin-bottom:5px;
}

.stat-value{
  font-size:13px;
  font-weight:bold;
}

.bottom-controls{
  position:absolute;
  bottom:20px;
  left:0;
  width:100%;
  z-index:9999;
  display:flex;
  justify-content:center;
  gap:12px;
}

.btn{
  border:none;
  padding:15px 22px;
  border-radius:14px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}

.start-btn{
  background:#16a34a;
}

.end-btn{
  background:#dc2626;
}

.follow-btn{
  background:#2563eb;
}

.leaflet-control-attribution{
  display:none;
}

/* SMALL GPS ARROW */
.gps-arrow{
  width:0;
  height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-bottom:34px solid #00ff88;
  filter:
    drop-shadow(0 0 8px #00ff88)
    drop-shadow(0 0 16px rgba(0,255,136,.6));
  transform-origin:50% 65%;
}

.gps-arrow::after{
  content:"";
  position:absolute;
  left:-5px;
  top:22px;
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
}

</style>

</head>

<body>

<div class="top-bar">

  <div class="address-box">
    <div class="label">EXACT ADDRESS</div>
    <div id="address">Waiting for GPS...</div>
  </div>

  <div class="stats-grid">

    <div class="stat-card">
      <div class="stat-label">START</div>
      <div id="startTime" class="stat-value">--:--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">END</div>
      <div id="endTime" class="stat-value">--:--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">SPEED</div>
      <div id="speed" class="stat-value">0 MPH</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">GPS ACCURACY</div>
      <div id="accuracy" class="stat-value">--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">HEADING</div>
      <div id="heading" class="stat-value">--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">DISTANCE</div>
      <div id="distance" class="stat-value">0 MI</div>
    </div>

  </div>

</div>

<div id="map"></div>

<div class="bottom-controls">

  <button id="startBtn" class="btn start-btn">
    LOCATE ME
  </button>

  <button id="followBtn" class="btn follow-btn">
    FOLLOW ON
  </button>

  <button id="endBtn" class="btn end-btn">
    END PATROL
  </button>

</div>

<script>

let map;
let marker;
let watchId;

let patrolPath = [];
let patrolLine;

let totalDistance = 0;
let followMode = true;

let lastAcceptedPosition = null;
let lastAcceptedTime = null;
let smoothedPosition = null;

let lastGeocodeTime = 0;

const startBtn = document.getElementById("startBtn");
const endBtn = document.getElementById("endBtn");
const followBtn = document.getElementById("followBtn");

const startTimeEl = document.getElementById("startTime");
const endTimeEl = document.getElementById("endTime");
const speedEl = document.getElementById("speed");
const accuracyEl = document.getElementById("accuracy");
const headingEl = document.getElementById("heading");
const distanceEl = document.getElementById("distance");
const addressEl = document.getElementById("address");

map = L.map("map",{
  zoomControl:true
}).setView([33.4484,-112.0740],19);

/* SATELLITE MAP */
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:22
  }
).addTo(map);

/* ENHANCED ROUTE TRAIL */
patrolLine = L.polyline([],{
  color:"#00ff88",
  weight:5,
  opacity:1,
  smoothFactor:1.2
}).addTo(map);

/* SMALL GPS ARROW ICON */
const arrowIcon = L.divIcon({
  className:"",
  html:`<div class="gps-arrow" id="gpsArrow"></div>`,
  iconSize:[34,44],
  iconAnchor:[17,28]
});

startBtn.addEventListener("click",startPatrol);
endBtn.addEventListener("click",endPatrol);
followBtn.addEventListener("click",toggleFollow);

function toggleFollow(){

  followMode = !followMode;

  followBtn.innerText =
    followMode ? "FOLLOW ON" : "FOLLOW OFF";
}

function startPatrol(){

  followMode = true;

  startTimeEl.innerText =
    new Date().toLocaleTimeString();

  if(!navigator.geolocation){
    alert("GPS NOT SUPPORTED");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    updatePosition,
    locationError,
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:3000
    }
  );

  setupCompass();
}

function endPatrol(){

  endTimeEl.innerText =
    new Date().toLocaleTimeString();

  if(watchId){
    navigator.geolocation.clearWatch(watchId);
  }

  followMode = false;
}

async function updatePosition(position){

  const rawLat = position.coords.latitude;
  const rawLng = position.coords.longitude;
  const accuracy = position.coords.accuracy;
  const speedMps = position.coords.speed || 0;
  const speedMph = speedMps * 2.23694;

  const now = Date.now();
  const rawPoint = [rawLat,rawLng];

  /*
    GPS DRIFT CONTROL:
    - Rejects garbage fixes.
    - Allows faster movement.
    - Smooths jitter.
    - Keeps breadcrumbs cleaner.
  */

  const movingFast = speedMph > 15;
  const movingVeryFast = speedMph > 60;

  let maxAllowedAccuracy = 20;

  if(movingFast) maxAllowedAccuracy = 35;
  if(movingVeryFast) maxAllowedAccuracy = 60;

  if(accuracy > maxAllowedAccuracy){
    return;
  }

  if(lastAcceptedPosition && lastAcceptedTime){

    const seconds =
      (now - lastAcceptedTime) / 1000;

    const jumpDistance =
      map.distance(lastAcceptedPosition,rawPoint);

    const calculatedSpeedMph =
      (jumpDistance / seconds) * 2.23694;

    if(calculatedSpeedMph > 700){
      return;
    }

    if(jumpDistance < 2 && speedMph < 2){
      return;
    }
  }

  let finalPoint = rawPoint;

  if(smoothedPosition){

    let alpha = 0.35;

    if(speedMph > 10) alpha = 0.55;
    if(speedMph > 35) alpha = 0.75;
    if(speedMph > 80) alpha = 0.9;

    const smoothLat =
      smoothedPosition[0] +
      alpha * (rawLat - smoothedPosition[0]);

    const smoothLng =
      smoothedPosition[1] +
      alpha * (rawLng - smoothedPosition[1]);

    finalPoint = [smoothLat,smoothLng];

  }

  smoothedPosition = finalPoint;

  if(lastAcceptedPosition){

    totalDistance +=
      map.distance(lastAcceptedPosition,finalPoint);
  }

  lastAcceptedPosition = finalPoint;
  lastAcceptedTime = now;

  patrolPath.push(finalPoint);
  patrolLine.setLatLngs(patrolPath);

  if(!marker){

    marker = L.marker(finalPoint,{
      icon:arrowIcon
    }).addTo(map);

  }else{

    marker.setLatLng(finalPoint);
  }

  if(followMode){

    map.panTo(finalPoint,{
      animate:true
    });
  }

  speedEl.innerText =
    speedMph.toFixed(1) + " MPH";

  accuracyEl.innerText =
    accuracy.toFixed(1) + " m";

  distanceEl.innerText =
    (totalDistance * 0.000621371)
    .toFixed(2) + " MI";

  /*
    Do not hammer the address API.
    It updates every 10 seconds.
  */

  if(now - lastGeocodeTime > 10000){

    lastGeocodeTime = now;

    reverseGeocode(rawLat,rawLng);
  }
}

async function reverseGeocode(lat,lng){

  addressEl.innerText = "Checking address...";

  try{

    /*
      More exact street-level lookup.
      Nominatim usually gives house number + road
      if the GPS point and map data support it.
    */

    const url =
      `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;

    const response = await fetch(url,{
      headers:{
        "Accept":"application/json"
      }
    });

    const data = await response.json();

    const a = data.address || {};

    const exactAddress = [
      a.house_number,
      a.road,
      a.neighbourhood || a.suburb,
      a.city || a.town || a.village,
      a.state,
      a.postcode
    ].filter(Boolean).join(", ");

    addressEl.innerText =
      exactAddress ||
      data.display_name ||
      "Exact address unavailable";

  }catch(err){

    addressEl.innerText =
      "Exact address unavailable";
  }
}

function setupCompass(){

  if(typeof DeviceOrientationEvent === "undefined"){
    return;
  }

  if(typeof DeviceOrientationEvent.requestPermission === "function"){

    DeviceOrientationEvent.requestPermission()
    .then(permissionState=>{

      if(permissionState === "granted"){

        window.addEventListener(
          "deviceorientation",
          updateCompass,
          true
        );
      }
    });

  }else{

    window.addEventListener(
      "deviceorientationabsolute",
      updateCompass,
      true
    );

    window.addEventListener(
      "deviceorientation",
      updateCompass,
      true
    );
  }
}

function updateCompass(event){

  let heading;

  if(event.webkitCompassHeading){

    heading = event.webkitCompassHeading;

  }else if(event.absolute && event.alpha !== null){

    heading = 360 - event.alpha;

  }else if(event.alpha !== null){

    heading = 360 - event.alpha;

  }else{

    return;
  }

  heading = Math.round(heading);

  headingEl.innerText = heading + "°";

  const arrow =
    document.getElementById("gpsArrow");

  if(arrow){

    arrow.style.transform =
      `rotate(${heading}deg)`;
  }
}

function locationError(err){

  console.error(err);

  alert("GPS ERROR: " + err.message);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Patrol Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
--bg:#0b1118;
--panel:#141b24;
--line:#2a3440;
--text:#e6edf3;
--muted:#96a3b3;
--accent:#1f6feb;
--success:#16a34a;
--warn:#d48a12;
--danger:#dc2626;

--safe-top: env(safe-area-inset-top,0px);
--safe-bottom: env(safe-area-inset-bottom,0px);
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui;
overflow:hidden;
}

.app{
height:100vh;
display:grid;
grid-template-rows:auto 1fr auto auto;
gap:8px;
padding:calc(10px + var(--safe-top)) 10px calc(10px + var(--safe-bottom));
}

/* ADDRESS */
.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:12px;
}

h3{
margin:0 0 6px;
font-size:.7rem;
letter-spacing:.08em;
color:var(--muted);
}

.address{
font-weight:900;
font-size:.9rem;
}

/* MAP */
.map{
border-radius:16px;
overflow:hidden;
border:1px solid var(--line);
height:100%;
}
#map{height:100%;}

/* STATUS */
.status{
display:flex;
align-items:center;
gap:10px;
}

.dot{
width:12px;height:12px;border-radius:50%;
background:#888;
}
.active{background:var(--success);}
.paused{background:var(--warn);}
.stopped{background:var(--danger);}

/* BADGES */
.badges{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}
.badge{
padding:10px;
text-align:center;
border-radius:999px;
border:1px solid var(--line);
font-weight:900;
}

/* CONTROLS */
.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}
button{
padding:12px;
border-radius:14px;
border:none;
font-weight:900;
color:#fff;
}
.primary{background:#1f6feb;}
.success{background:#16a34a;}
.warn{background:#d48a12;}
.danger{background:#dc2626;}
.neutral{background:#2b3440;}

button:disabled{opacity:.4}
</style>
</head>

<body>

<div class="app">

<!-- ADDRESS -->
<div class="card">
<h3>Current Address</h3>
<div id="address" class="address">Waiting for GPS...</div>
</div>

<!-- MAP -->
<div class="map"><div id="map"></div></div>

<!-- STATUS -->
<div class="card status">
<div id="dot" class="dot"></div>
<div id="statusText">Ready</div>
</div>

<!-- BADGES -->
<div class="badges">
<div id="markersBadge" class="badge">Markers: 0</div>
<div id="pointsBadge" class="badge">Breadcrumbs: 0</div>
</div>

<!-- CONTROLS -->
<div class="controls">
<button id="locateBtn" class="primary">Locate</button>
<button id="startBtn" class="success" disabled>Start</button>
<button id="pauseBtn" class="warn" disabled>Pause</button>
<button id="resumeBtn" class="neutral" disabled>Resume</button>
<button id="markBtn" class="neutral">Mark</button>
<button id="endBtn" class="danger" disabled>End</button>
</div>

</div>

<script>

/* STATE */
let map = L.map("map").setView([33.4484,-112.074],13);

L.tileLayer(
"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
).addTo(map);

let userMarker=null;
let watchId=null;

let isTracking=false;
let isPaused=false;

let lastPoint=null;
let breadcrumbs=0;
let markers=0;

/* UI */
const address=document.getElementById("address");
const statusText=document.getElementById("statusText");
const dot=document.getElementById("dot");
const markersBadge=document.getElementById("markersBadge");
const pointsBadge=document.getElementById("pointsBadge");

const startBtn=document.getElementById("startBtn");
const pauseBtn=document.getElementById("pauseBtn");
const resumeBtn=document.getElementById("resumeBtn");
const endBtn=document.getElementById("endBtn");

/* STATUS */
function updateStatus(mode){
dot.className="dot";
if(mode==="active"){dot.classList.add("active");statusText.textContent="Tracking";}
else if(mode==="paused"){dot.classList.add("paused");statusText.textContent="Paused";}
else if(mode==="stopped"){dot.classList.add("stopped");statusText.textContent="Ended";}
else{statusText.textContent="Ready";}
}

/* BUTTON LOGIC */
function updateButtons(){
startBtn.disabled = !userMarker || isTracking;
pauseBtn.disabled = !isTracking || isPaused;
resumeBtn.disabled = !isTracking || !isPaused;
endBtn.disabled = !isTracking;
}

/* GPS UPDATE */
function updateLocation(lat,lng){

if(!userMarker){
userMarker=L.circleMarker([lat,lng],{radius:8,color:"#fff",fillColor:"#1f6feb",fillOpacity:1}).addTo(map);
}else{
userMarker.setLatLng([lat,lng]);
}

map.setView([lat,lng],18);

fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
.then(r=>r.json())
.then(d=>address.textContent=d.display_name);

/* TRACKING */
if(isTracking && !isPaused){

if(!lastPoint){
lastPoint=[lat,lng];
}else{
const dist=map.distance(lastPoint,[lat,lng]);

// 🔥 FIXED GPS LOGIC (better at speed)
if(dist > 1){
L.circleMarker([lat,lng],{radius:3,color:"#1f6feb"}).addTo(map);
breadcrumbs++;
pointsBadge.textContent=`Breadcrumbs: ${breadcrumbs}`;
lastPoint=[lat,lng];
}
}
}
}

/* GPS */
function gpsSuccess(pos){
updateLocation(pos.coords.latitude,pos.coords.longitude);
updateButtons();
}

function gpsError(e){
alert(e.message);
}

/* BUTTONS */
document.getElementById("locateBtn").onclick=()=>{
navigator.geolocation.getCurrentPosition(gpsSuccess,gpsError,{enableHighAccuracy:true});
watchId=navigator.geolocation.watchPosition(gpsSuccess,gpsError,{enableHighAccuracy:true,maximumAge:0});
};

startBtn.onclick=()=>{
isTracking=true;
isPaused=false;
updateStatus("active");
updateButtons();
};

pauseBtn.onclick=()=>{
isPaused=true;
updateStatus("paused");
updateButtons();
};

resumeBtn.onclick=()=>{
isPaused=false;
updateStatus("active");
updateButtons();
};

document.getElementById("markBtn").onclick=()=>{
if(userMarker){
L.marker(userMarker.getLatLng()).addTo(map);
markers++;
markersBadge.textContent=`Markers: ${markers}`;
}
};

endBtn.onclick=()=>{
isTracking=false;
isPaused=false;
updateStatus("stopped");
updateButtons();
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tactical Patrol Tracker</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0f14;
  color:#fff;
  overflow:hidden;
}

#map{
  height:100vh;
  width:100%;
  z-index:1;
}

.top-bar{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:9999;
  padding:10px;
  background:rgba(5,10,15,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1f2937;
}

.address-box{
  margin-bottom:10px;
}

.label{
  font-size:11px;
  color:#00ffb3;
  letter-spacing:1px;
  margin-bottom:4px;
}

#address{
  font-size:14px;
  font-weight:bold;
  line-height:1.3;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.stat-card{
  background:#111827;
  border:1px solid #1f2937;
  border-radius:14px;
  padding:10px;
  text-align:center;
}

.stat-label{
  font-size:10px;
  color:#9ca3af;
  margin-bottom:4px;
}

.stat-value{
  font-size:14px;
  font-weight:bold;
}

.bottom-controls{
  position:absolute;
  bottom:20px;
  left:0;
  width:100%;
  z-index:9999;
  display:flex;
  justify-content:center;
  gap:14px;
}

.btn{
  border:none;
  padding:16px 24px;
  border-radius:14px;
  font-size:15px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
}

.start-btn{
  background:#16a34a;
}

.end-btn{
  background:#dc2626;
}

.leaflet-control-attribution{
  display:none;
}

.leaflet-control-zoom{
  display:none;
}

.tactical-dot{
  width:20px;
  height:20px;
  background:#00ff88;
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:0 0 20px #00ff88;
}

</style>
</head>

<body>

<div class="top-bar">

  <div class="address-box">
    <div class="label">CURRENT LOCATION</div>
    <div id="address">Waiting for GPS...</div>
  </div>

  <div class="stats-grid">

    <div class="stat-card">
      <div class="stat-label">PATROL START</div>
      <div id="startTime" class="stat-value">--:--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">PATROL END</div>
      <div id="endTime" class="stat-value">--:--</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">SPEED</div>
      <div id="speed" class="stat-value">0 MPH</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">GPS ACCURACY</div>
      <div id="accuracy" class="stat-value">--</div>
    </div>

  </div>
</div>

<div id="map"></div>

<div class="bottom-controls">

  <button id="startBtn" class="btn start-btn">
    LOCATE ME
  </button>

  <button id="endBtn" class="btn end-btn">
    END PATROL
  </button>

</div>

<script>

let map;
let marker;
let watchId;
let patrolLine;

let patrolPath = [];

const startBtn = document.getElementById("startBtn");
const endBtn = document.getElementById("endBtn");

const startTimeEl = document.getElementById("startTime");
const endTimeEl = document.getElementById("endTime");
const addressEl = document.getElementById("address");
const speedEl = document.getElementById("speed");
const accuracyEl = document.getElementById("accuracy");

map = L.map("map",{
  zoomControl:false
}).setView([33.4484,-112.0740],18);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:22
  }
).addTo(map);

patrolLine = L.polyline([],{
  color:"#00ff88",
  weight:5,
  opacity:1
}).addTo(map);

const tacticalIcon = L.divIcon({
  className:"",
  html:'<div class="tactical-dot"></div>',
  iconSize:[20,20]
});

startBtn.addEventListener("click",startPatrol);
endBtn.addEventListener("click",endPatrol);

function startPatrol(){

  startTimeEl.innerText =
    new Date().toLocaleTimeString();

  if(!navigator.geolocation){
    alert("Geolocation not supported.");
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    updatePosition,
    locationError,
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:10000
    }
  );
}

function endPatrol(){

  endTimeEl.innerText =
    new Date().toLocaleTimeString();

  if(watchId){
    navigator.geolocation.clearWatch(watchId);
  }
}

async function updatePosition(position){

  const lat = position.coords.latitude;
  const lng = position.coords.longitude;

  const accuracy = position.coords.accuracy;

  const speedMps = position.coords.speed || 0;
  const speedMph = speedMps * 2.23694;

  accuracyEl.innerText =
    accuracy.toFixed(1) + " m";

  speedEl.innerText =
    speedMph.toFixed(1) + " MPH";

  const point = [lat,lng];

  patrolPath.push(point);

  patrolLine.setLatLngs(patrolPath);

  if(!marker){

    marker = L.marker(point,{
      icon:tacticalIcon
    }).addTo(map);

  }else{

    marker.setLatLng(point);
  }

  map.setView(point,20,{
    animate:true
  });

  reverseGeocode(lat,lng);
}

async function reverseGeocode(lat,lng){

  try{

    const response = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
    );

    const data = await response.json();

    addressEl.innerText =
      data.display_name || "Address unavailable";

  }catch(err){

    addressEl.innerText =
      "Unable to fetch address";
  }
}

function locationError(err){

  console.error(err);

  alert(
    "GPS ERROR: " + err.message
  );
}

</script>

</body>
</html>

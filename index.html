<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>Patrol Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <style>
    :root {
      --bg: #0b1118;
      --panel: rgba(20, 27, 36, 0.96);
      --panel-2: rgba(24, 32, 43, 0.96);
      --line: #2a3440;
      --text: #e6edf3;
      --muted: #96a3b3;
      --accent: #1f6feb;
      --success: #16a34a;
      --warn: #d48a12;
      --danger: #dc2626;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      --radius: 18px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      padding:
        calc(8px + var(--safe-top))
        calc(8px + var(--safe-right))
        calc(8px + var(--safe-bottom))
        calc(8px + var(--safe-left));

      display: grid;
      grid-template-rows:
        auto
        minmax(220px, 1fr)
        auto
        auto
        auto;

      gap: 8px;
      background: var(--bg);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top-card {
      min-height: 92px;
      padding: 12px 14px;
    }

    .compact-card {
      min-height: 88px;
      padding: 12px 14px;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .address-text {
      font-size: 0.85rem;
      line-height: 1.25;
      font-weight: 800;
      word-break: break-word;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 900;
    }

    .metric-sub {
      margin-top: 4px;
      font-size: 0.66rem;
      color: var(--muted);
    }

    .map-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: #0b0f14;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 220px;
    }

    .status-session-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #131920;
      font-size: 0.78rem;
      font-weight: 900;
      width: fit-content;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--muted);
    }

    .dot.active {
      background: var(--success);
    }

    .dot.paused {
      background: var(--warn);
    }

    .dot.stopped {
      background: var(--danger);
    }

    .timeline-details {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .timeline-details summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 800;
    }

    .timeline-content {
      padding: 0 14px 12px 14px;
    }

    .timeline-log {
      max-height: 112px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      background: rgba(0,0,0,0.18);
      padding: 4px;
    }

    .log-item {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.72rem;
    }

    .badges-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .badge {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      box-shadow: var(--shadow);
      font-size: 0.72rem;
      font-weight: 900;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      width: 100%;
      min-height: 54px;
      padding: 10px 8px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 900;
      background: linear-gradient(180deg, #1a2129, #141a21);
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary {
      background: linear-gradient(180deg, #1f6feb, #1857bb);
    }

    .success {
      background: linear-gradient(180deg, #1f9d55, #167c42);
    }

    .warn {
      background: linear-gradient(180deg, #d48a12, #a76508);
    }

    .danger {
      background: linear-gradient(180deg, #dc2626, #a91d1d);
    }

    .neutral {
      background: linear-gradient(180deg, #2b3440, #212933);
    }
  </style>
</head>

<body>

  <div class="app">

    <section class="topbar">

      <div class="card top-card">
        <h3>Current Address</h3>
        <div id="addressText" class="address-text">
          Waiting for GPS...
        </div>
      </div>

      <div class="card top-card">
        <h3>GPS Accuracy</h3>
        <div id="accuracyValue" class="metric-value">--</div>
        <div id="accuracySub" class="metric-sub">
          Confidence pending
        </div>
      </div>

    </section>

    <section class="map-card">
      <div id="map"></div>
    </section>

    <section class="status-session-row">

      <div class="card compact-card">
        <h3>Patrol Status</h3>

        <div id="statusPill" class="status-pill">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">Ready</span>
        </div>

        <div class="metric-sub">
          Locate first, then start patrol.
        </div>
      </div>

      <div class="card compact-card">
        <h3>Patrol Session</h3>

        <div class="metric-sub">
          Session tracking active
        </div>
      </div>

    </section>

    <details class="timeline-details" open>

      <summary>
        Event Timeline
      </summary>

      <div class="timeline-content">
        <div id="log" class="timeline-log"></div>
      </div>

    </details>

    <section class="badges-row">
      <div id="coordsBadge" class="badge">
        Airspace pending
      </div>

      <div id="markersBadge" class="badge">
        Markers: 0
      </div>

      <div id="pointsBadge" class="badge">
        Breadcrumbs: 0
      </div>
    </section>

    <section class="controls">

      <button id="locateBtn" class="primary">
        Locate Me
      </button>

      <button id="startBtn" class="success">
        Clock In
      </button>

      <button id="pauseBtn" class="warn">
        Pause
      </button>

      <button id="resumeBtn" class="neutral">
        Resume
      </button>

      <button id="markBtn" class="neutral">
        Mark Location
      </button>

      <button id="endBtn" class="danger">
        End Patrol
      </button>

    </section>

  </div>

  <script>

    const map = L.map("map", {
      zoomControl: true
    }).setView([33.4484, -112.0740], 13);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "Tiles © Esri"
      }
    ).addTo(map);

    const log = document.getElementById("log");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");

    function addLog(message) {

      const item = document.createElement("div");

      item.className = "log-item";

      item.innerHTML = `
        <div>${new Date().toLocaleTimeString()}</div>
        <div>${message}</div>
      `;

      log.prepend(item);
    }

    document.getElementById("locateBtn").addEventListener("click", () => {

      navigator.geolocation.getCurrentPosition((pos) => {

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        map.setView([lat, lng], 18);

        document.getElementById("accuracyValue").textContent =
          `±${acc} m`;

        document.getElementById("addressText").textContent =
          `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

        L.circleMarker([lat, lng], {
          radius: 8,
          color: "#ffffff",
          fillColor: "#1f6feb",
          fillOpacity: 1
        }).addTo(map);

        addLog("GPS lock acquired");

      });

    });

    document.getElementById("startBtn").addEventListener("click", () => {

      statusDot.className = "dot active";
      statusText.textContent = "Tracking";

      addLog("Patrol started");

    });

    document.getElementById("pauseBtn").addEventListener("click", () => {

      statusDot.className = "dot paused";
      statusText.textContent = "Paused";

      addLog("Patrol paused");

    });

    document.getElementById("resumeBtn").addEventListener("click", () => {

      statusDot.className = "dot active";
      statusText.textContent = "Tracking";

      addLog("Patrol resumed");

    });

    document.getElementById("markBtn").addEventListener("click", () => {

      addLog("Manual marker placed");

    });

    document.getElementById("endBtn").addEventListener("click", () => {

      statusDot.className = "dot stopped";
      statusText.textContent = "Ended";

      addLog("Patrol ended");

    });

    addLog("System ready");

  </script>

</body>
</html>
